[project]
name = "rag-center"
version = "0.1.0"
description = "A minimal RAG capability center skeleton."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pgvector>=0.3.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0",
  "celery[redis]>=5.4.0",
  "redis>=5.0.0",
  "langfuse>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]
eval = [
  "ragas>=0.2.0,<0.5",
  "datasets>=2.0.0",
  "openai>=1.0.0",
]
parsers = [
  "mammoth>=1.6.0",
  "markdownify>=0.13.0",
  "pymupdf>=1.24.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
